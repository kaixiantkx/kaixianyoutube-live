<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Live Break Scene - OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           THEME & QUICK SETTINGS
           ============================================================ */
        :root {
            --bg-color: #080705;
            --accent: #ffd866;
            --accent-glow: rgba(255, 216, 102, 0.15);
            --live-red: #e6453c;
            --text-main: #f3ecdf;
            --btn-bg: rgba(255, 216, 102, 0.12);
            --btn-border: rgba(255, 216, 102, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            background-color: var(--bg-color);
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* 粒子背景 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* ================= LEFT AREA ================= */
        .left-area {
            flex: 0 0 auto;
            width: 800px;
            display: flex;
            flex-direction: column;
            padding: 50px 0 50px 60px;
            position: relative;
        }

        .left-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 9, 7, 0.40) 0%, rgba(10, 9, 7, 0.05) 100%);
            backdrop-filter: blur(3px);
            z-index: -1;
            pointer-events: none;
        }

        .left-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 24px; /* 加大间距，让排版更舒展 */
            padding-top: 10px;
        }

        .live-row {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 44px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .live-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--live-red);
            box-shadow: 0 0 0 0 rgba(230, 69, 60, 0.7);
            animation: pulse 1.6s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 69, 60, 0.55); }
            70% { box-shadow: 0 0 0 36px rgba(230, 69, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 69, 60, 0); }
        }

        #clock {
            font-size: 56px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
            margin-top: 4px;
        }

        #website-line {
            font-size: 32px;
            opacity: 0.9;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
        }

        #website-line .url {
            font-weight: 600;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(255, 216, 102, 0.15);
        }

        /* ================= RIGHT AREA (BREAK 区) ================= */
        .right-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .breathing-halo {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
            z-index: 1;
            animation: breathe 8s ease-in-out infinite; 
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.8); opacity: 0.2; }
        }

        .break-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .break-title {
            font-size: 140px;
            font-weight: 300;
            letter-spacing: 24px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 4px 60px rgba(255, 216, 102, 0.3);
            margin-bottom: -10px;
            margin-right: -24px; 
        }

        /* 手动控制：Break Timer */
        .break-timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 60px;
            position: relative;
        }

        .break-timer-box {
            font-size: 48px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 40px;
            border-radius: 100px;
            border: 1px solid rgba(255, 216, 102, 0.2);
            backdrop-filter: blur(8px);
            z-index: 2;
        }

        .break-timer-controls {
            display: flex;
            gap: 12px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
            pointer-events: none;
            position: absolute;
            top: 100%;
            margin-top: 16px;
            z-index: 1;
        }

        /* 悬停显示休息钟控制按钮 */
        .break-timer-container:hover .break-timer-controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .break-timer-controls button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .break-timer-controls button:hover { background: rgba(255, 216, 102, 0.25); border-color: var(--accent); }
        .break-timer-controls button.reset-btn { border-color: rgba(230, 69, 60, 0.25); }
        .break-timer-controls button.reset-btn:hover { background: rgba(230, 69, 60, 0.25); border-color: var(--live-red); }

        .break-message {
            font-family: 'Noto Serif SC', serif;
            font-size: 36px;
            font-weight: 300;
            line-height: 2.0;
            color: var(--text-main);
            letter-spacing: 2px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
        }

        .break-message .highlight {
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="main-container">
        <!-- ================= LEFT AREA ================= -->
        <!-- 左侧现在彻底干净，只有标识、时钟和网址 -->
        <div class="left-area">
            <div class="left-content">
                <div class="live-row">
                    <div class="live-dot"></div>
                    <span>LIVE · MINDFUL BREAK</span>
                </div>
                
                <div id="clock"></div>

                <div id="website-line">
                    Website： <span class="url">https://kaixiantkx.github.io/kaixianyoutube-live/</span>
                </div>
            </div>
        </div>

        <!-- ================= RIGHT AREA ================= -->
        <div class="right-area">
            <div class="breathing-halo"></div>
            
            <div class="break-content">
                <div class="break-title">BREAK</div>
                
                <!-- 纯手动的休息计时器 -->
                <div class="break-timer-container" title="OBS Interact: 悬停操控休息时间">
                    <div class="break-timer-box" id="break-timer-value">00:00:00</div>
                    <div class="break-timer-controls">
                        <button id="break-btn-toggle">▶ Start</button>
                        <button class="reset-btn" id="break-btn-reset">↻ Reset</button>
                    </div>
                </div>

                <div class="break-message">
                    <span class="highlight">🌿</span> Meditation continues in silence.<br>
                    Taking a short mindful break.<br>
                    Thank you for your patience.
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-audio" preload="auto" autoplay loop></audio>

    <script>
        // --- 1. 时钟逻辑 ---
        function pad(n) { return String(n).padStart(2, '0'); }
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日  ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        // 2. BREAK TIMER (100% 独立且手动的逻辑)
        // 与主画面彻底断开连接
        // ============================================================
        const bAccKey = 'iso_break_acc';
        const bStateKey = 'iso_break_state';
        const bStartKey = 'iso_break_start';

        // 初始化：如果没有记录，默认暂停，归零
        if (!localStorage.getItem(bStateKey)) {
            localStorage.setItem(bAccKey, '0');
            localStorage.setItem(bStateKey, 'paused');
            localStorage.setItem(bStartKey, Date.now().toString());
        }

        function getBreakState() {
            return {
                acc: parseInt(localStorage.getItem(bAccKey)) || 0,
                state: localStorage.getItem(bStateKey) || 'paused',
                lastStart: parseInt(localStorage.getItem(bStartKey)) || Date.now()
            };
        }

        function syncBreakUI() {
            const { acc, state, lastStart } = getBreakState();
            let elapsed = acc;
            
            // 只有处在 running 状态时才增加时间差
            if (state === 'running') {
                elapsed += (Date.now() - lastStart);
            }

            // 更新显示
            const totalSecs = Math.floor(elapsed / 1000);
            document.getElementById('break-timer-value').textContent = 
                `${pad(Math.floor(totalSecs / 3600))}:${pad(Math.floor((totalSecs % 3600) / 60))}:${pad(totalSecs % 60)}`;

            // 更新按钮文字
            const btnToggle = document.getElementById('break-btn-toggle');
            if (state === 'paused') {
                btnToggle.textContent = '▶ Start';
            } else {
                btnToggle.textContent = '⏸ Pause';
            }
        }
        setInterval(syncBreakUI, 1000);
        syncBreakUI(); // 立即执行一次

        // Start / Pause 按钮点击事件
        document.getElementById('break-btn-toggle').addEventListener('click', () => {
            const { acc, state, lastStart } = getBreakState();
            if (state === 'running') {
                // 执行暂停：保存已累计的时间
                localStorage.setItem(bAccKey, (acc + (Date.now() - lastStart)).toString());
                localStorage.setItem(bStateKey, 'paused');
            } else {
                // 执行开始：更新最新起点
                localStorage.setItem(bStartKey, Date.now().toString());
                localStorage.setItem(bStateKey, 'running');
            }
            syncBreakUI();
        });

        // Reset 按钮点击事件
        document.getElementById('break-btn-reset').addEventListener('click', () => {
            // 归零，并且强制回到暂停状态
            localStorage.setItem(bAccKey, '0');
            localStorage.setItem(bStateKey, 'paused');
            localStorage.setItem(bStartKey, Date.now().toString());
            syncBreakUI();
        });

        // ============================================================
        // 3. CANVAS PARTICLES (粒子背景动画)
        // ============================================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1920; canvas.height = 1080;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5; 
                this.speedX = Math.random() * 0.3 - 0.15; 
                this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
                this.fadingOut = Math.random() > 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
                if (this.fadingOut) {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingOut = false;
                } else {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingOut = true;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 216, 102, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
