<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 手机：按真实屏幕宽度排版，禁止缩放，并铺满刘海/圆角区域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080705">
    <!-- 「添加到主屏幕」后以全屏方式打开（没有地址栏） -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Break">
    <!-- 防止 iOS 把时钟数字识别成电话号码 -->
    <meta name="format-detection" content="telephone=no">
    <title>Live Break Scene - OBS / Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           THEME & QUICK SETTINGS
           ============================================================ */
        :root {
            --bg-color: #080705;
            --accent: #ffd866;
            --accent-glow: rgba(255, 216, 102, 0.15);
            --live-red: #e6453c;
            --text-main: #f3ecdf;
            --btn-bg: rgba(255, 216, 102, 0.12);
            --btn-border: rgba(255, 216, 102, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Inter', Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            /* ---- 手机防误触：不滚动、不下拉刷新、不缩放、不选中文字 ---- */
            overscroll-behavior: none;
            touch-action: manipulation;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 网址加 ?bg=transparent 时：背景透明，可以叠在摄像头画面上 */
        .transparent-bg,
        .transparent-bg body {
            background-color: transparent;
        }

        /* 粒子背景：永远铺满整块屏幕 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        /* 安全区：避开刘海、圆角和底部横条 */
        #safe-frame {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            z-index: 1;
        }

        /* ============================================================
           舞台 (STAGE)
           横屏按 1920×1080 设计，竖屏按 1080×1920 设计，
           再由脚本整体等比缩放到当前屏幕 —— 电脑 OBS 里就是 1:1 原样。
           ============================================================ */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;
            display: flex;
            transform: translate(-50%, -50%);
            transform-origin: center center;
        }

        /* ================= LEFT AREA ================= */
        .left-area {
            flex: 0 0 auto;
            width: 800px;
            display: flex;
            flex-direction: column;
            padding: 50px 0 50px 60px;
            position: relative;
        }

        .left-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 9, 7, 0.40) 0%, rgba(10, 9, 7, 0.05) 100%);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            z-index: -1;
            pointer-events: none;
        }

        .left-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 24px; /* 加大间距，让排版更舒展 */
            padding-top: 10px;
        }

        .live-row {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 44px;
            font-weight: 600;
            letter-spacing: 4px;
            white-space: nowrap;
        }

        .live-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--live-red);
            box-shadow: 0 0 0 0 rgba(230, 69, 60, 0.7);
            animation: pulse 1.6s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 69, 60, 0.55); }
            70% { box-shadow: 0 0 0 36px rgba(230, 69, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 69, 60, 0); }
        }

        #clock {
            font-size: 56px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
            margin-top: 4px;
            white-space: nowrap;
        }

        #website-line {
            font-size: 32px;
            opacity: 0.9;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
        }

        /* 网址单独一行、不折断（原来会在 "-live/" 处断成两行） */
        #website-line .url {
            display: block;
            white-space: nowrap;
            font-size: 30px;
            margin-top: 6px;
            font-weight: 600;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(255, 216, 102, 0.15);
        }

        /* ================= RIGHT AREA (BREAK 区) ================= */
        .right-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .breathing-halo {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
            z-index: 1;
            animation: breathe 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.8); opacity: 0.2; }
        }

        .break-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .break-title {
            font-size: 140px;
            font-weight: 300;
            letter-spacing: 24px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 4px 60px rgba(255, 216, 102, 0.3);
            margin-bottom: -10px;
            margin-right: -24px;
        }

        /* 手动控制：Break Timer */
        .break-timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 60px;
            position: relative;
        }

        .break-timer-box {
            font-size: 48px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 40px;
            border-radius: 100px;
            border: 1px solid rgba(255, 216, 102, 0.2);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            z-index: 2;
            font-variant-numeric: tabular-nums; /* 数字等宽，计时框不会每秒忽宽忽窄 */
        }

        .break-timer-controls {
            display: flex;
            gap: 12px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
            pointer-events: none;
            position: absolute;
            top: 100%;
            margin-top: 16px;
            z-index: 1;
        }

        /* 电脑 / OBS Interact：悬停显示休息钟控制按钮（和原来一样） */
        .break-timer-container:hover .break-timer-controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 一旦检测到手指触屏，就改用底部的大按钮，这组小按钮不再出现 */
        .touch-mode .break-timer-controls {
            display: none;
        }

        .break-timer-controls button,
        #touch-bar button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: #fff;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .break-timer-controls button {
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 20px;
        }

        .break-timer-controls button:hover { background: rgba(255, 216, 102, 0.25); border-color: var(--accent); }
        .break-timer-controls button.reset-btn { border-color: rgba(230, 69, 60, 0.25); }
        .break-timer-controls button.reset-btn:hover { background: rgba(230, 69, 60, 0.25); border-color: var(--live-red); }

        .break-message {
            font-family: 'Noto Serif SC', serif;
            font-size: 36px;
            font-weight: 300;
            line-height: 2.0;
            color: var(--text-main);
            letter-spacing: 2px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
        }

        .break-message .highlight {
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        /* ============================================================
           竖屏排版 (手机直立时自动启用，设计尺寸 1080×1920)
           上：LIVE + 时钟　中：BREAK + 计时器 + 文字　下：网址
           ============================================================ */
        .portrait .main-container {
            width: 1080px;
            height: 1920px;
            flex-direction: column;
        }

        .portrait .left-area {
            position: static;
            width: 100%;
            padding: 120px 60px 0;
        }

        .portrait .left-area::before {
            display: none;
        }

        .portrait .left-content {
            align-items: center;
            text-align: center;
            gap: 30px;
            padding-top: 0;
        }

        .portrait .live-row { font-size: 46px; }
        /* 竖屏时钟是居中的：数字等宽，秒数跳动时整行不会左右抖 */
        .portrait #clock { font-size: 62px; margin-top: 0; font-variant-numeric: tabular-nums; }

        .portrait #website-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 120px;
            text-align: center;
            font-size: 34px;
            margin-top: 0;
        }

        .portrait #website-line .url {
            font-size: 36px;
            margin-top: 12px;
        }

        .portrait .right-area {
            padding-bottom: 240px; /* 给底部网址留位置 */
        }

        .portrait .breathing-halo {
            width: 1040px;
            height: 1040px;
        }

        .portrait .break-title {
            font-size: 200px;
            letter-spacing: 32px;
            margin-right: -32px;
            margin-bottom: 0;
        }

        .portrait .break-timer-container { margin-bottom: 90px; }

        .portrait .break-timer-box {
            font-size: 68px;
            padding: 16px 56px;
        }

        .portrait .break-message {
            font-size: 46px;
            line-height: 2.1;
        }

        /* ============================================================
           触屏控制条 (只在手机/平板上、轻点屏幕后出现，4 秒后自动隐藏)
           用真实像素绘制，不随舞台缩小，手指好按
           ============================================================ */
        #touch-bar {
            position: fixed;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            transform: translate(-50%, 14px);
            display: flex;
            gap: 10px;
            padding: 10px;
            border-radius: 20px;
            background: rgba(8, 7, 5, 0.78);
            border: 1px solid var(--btn-border);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 10;
            max-width: calc(100vw - 16px);
        }

        #touch-bar.show {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }

        #touch-bar button {
            min-width: 104px;
            min-height: 50px;
            padding: 0 16px;
            border-radius: 14px;
            font-size: 16px;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }

        #touch-bar button:active { background: rgba(255, 216, 102, 0.3); border-color: var(--accent); }
        #touch-bar button.reset-btn { border-color: rgba(230, 69, 60, 0.35); }
        #touch-bar button.reset-btn.armed {
            background: rgba(230, 69, 60, 0.35);
            border-color: var(--live-red);
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div id="safe-frame">
        <div class="main-container" id="stage">
            <!-- ================= LEFT AREA ================= -->
            <!-- 左侧现在彻底干净，只有标识、时钟和网址 -->
            <div class="left-area">
                <div class="left-content">
                    <div class="live-row">
                        <div class="live-dot"></div>
                        <span>LIVE · MINDFUL BREAK</span>
                    </div>

                    <div id="clock"></div>

                    <div id="website-line">
                        Website： <span class="url">https://kaixiantkx.github.io/kaixianyoutube-live/</span>
                    </div>
                </div>
            </div>

            <!-- ================= RIGHT AREA ================= -->
            <div class="right-area">
                <div class="breathing-halo"></div>

                <div class="break-content">
                    <div class="break-title">BREAK</div>

                    <!-- 纯手动的休息计时器 -->
                    <div class="break-timer-container" title="OBS Interact: 悬停操控休息时间">
                        <div class="break-timer-box" id="break-timer-value">00:00:00</div>
                        <div class="break-timer-controls">
                            <button id="break-btn-toggle">▶ Start</button>
                            <button class="reset-btn" id="break-btn-reset">↻ Reset</button>
                        </div>
                    </div>

                    <div class="break-message">
                        <span class="highlight">🌿</span> Meditation continues in silence.<br>
                        Taking a short mindful break.<br>
                        Thank you for your patience.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 触屏控制条：轻点屏幕任意位置呼出 -->
    <div id="touch-bar">
        <button id="touch-btn-toggle">▶ Start</button>
        <button class="reset-btn" id="touch-btn-reset">↻ Reset</button>
        <button id="touch-btn-full">Fullscreen</button>
    </div>

    <audio id="bg-audio" preload="auto" autoplay loop></audio>

    <script>
        // ============================================================
        // 0. 自适应缩放 (电脑 OBS、手机横屏、手机竖屏 共用同一个文件)
        // ============================================================
        const root = document.documentElement;
        const frame = document.getElementById('safe-frame');
        const stage = document.getElementById('stage');
        let stageScale = 1;

        // ------------------------------------------------------------
        // 网址参数 (全部可选) —— 给 PRISM 等手机推流 App 的「Web 小工具」用：
        // 那里只能填一个网址，而且多半点不到页面里的按钮，所以用网址来设定。
        //
        //   ?auto=1             页面一载入，休息计时器自动从 00:00:00 开始走
        //   ?layout=landscape   强制横屏排版 (portrait = 强制竖屏)；不写就按画面形状自动判断
        //   ?bg=transparent     背景透明，叠在摄像头画面上；不写就是不透明黑底 (盖住摄像头)
        //
        //   可以组合，例如： .../这个文件.html?auto=1&layout=landscape
        // ------------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const flag = name => ['1', 'true', 'yes', 'on'].includes((params.get(name) || '').toLowerCase());
        const AUTO_START = flag('auto');
        const FORCED_LAYOUT = (params.get('layout') || '').toLowerCase(); // 'landscape' | 'portrait' | ''
        if ((params.get('bg') || '').toLowerCase() === 'transparent') root.classList.add('transparent-bg');

        function fitStage() {
            const w = frame.clientWidth || window.innerWidth;
            const h = frame.clientHeight || window.innerHeight;
            const portrait = FORCED_LAYOUT === 'portrait' ? true
                           : FORCED_LAYOUT === 'landscape' ? false
                           : h > w;
            root.classList.toggle('portrait', portrait);

            const designW = portrait ? 1080 : 1920;
            const designH = portrait ? 1920 : 1080;
            stageScale = Math.min(w / designW, h / designH);
            stage.style.transform = `translate(-50%, -50%) scale(${stageScale})`;

            resizeParticles();
        }

        // --- 1. 时钟逻辑 ---
        function pad(n) { return String(n).padStart(2, '0'); }
        const clockEl = document.getElementById('clock');
        function updateClock() {
            const now = new Date();
            const text = `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日  ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            if (clockEl.textContent !== text) clockEl.textContent = text;
        }

        // ============================================================
        // 2. BREAK TIMER (100% 独立且手动的逻辑)
        // 与主画面彻底断开连接
        // 时间用「起点时间戳」计算：手机锁屏、切去别的 App、刷新页面
        // 回来之后，计时依然是准的。
        // ============================================================
        const bAccKey = 'iso_break_acc';
        const bStateKey = 'iso_break_state';
        const bStartKey = 'iso_break_start';

        // 个别手机浏览器（无痕模式等）禁用 localStorage，这时退回内存保存，页面照常工作
        const memoryStore = () => {
            const mem = {};
            return {
                getItem: k => (k in mem ? mem[k] : null),
                setItem: (k, v) => { mem[k] = String(v); }
            };
        };
        const store = (() => {
            // 自动模式 (?auto=1)：每次载入都是全新的一次休息，不读也不写旧记录
            if (AUTO_START) return memoryStore();
            try {
                localStorage.setItem('__probe', '1');
                localStorage.removeItem('__probe');
                return localStorage;
            } catch (e) {
                return memoryStore();
            }
        })();

        // 从零开始并立刻计时 (自动模式用)
        function startFromZero() {
            store.setItem(bAccKey, '0');
            store.setItem(bStartKey, Date.now().toString());
            store.setItem(bStateKey, 'running');
        }

        if (AUTO_START) {
            startFromZero();
        } else if (!store.getItem(bStateKey)) {
            // 手动模式初始化：如果没有记录，默认暂停，归零
            store.setItem(bAccKey, '0');
            store.setItem(bStateKey, 'paused');
            store.setItem(bStartKey, Date.now().toString());
        }

        function getBreakState() {
            return {
                acc: parseInt(store.getItem(bAccKey)) || 0,
                state: store.getItem(bStateKey) || 'paused',
                lastStart: parseInt(store.getItem(bStartKey)) || Date.now()
            };
        }

        const timerEl = document.getElementById('break-timer-value');
        const btnToggle = document.getElementById('break-btn-toggle');
        const touchToggle = document.getElementById('touch-btn-toggle');

        function syncBreakUI() {
            const { acc, state, lastStart } = getBreakState();
            let elapsed = acc;

            // 只有处在 running 状态时才增加时间差
            if (state === 'running') {
                elapsed += (Date.now() - lastStart);
            }

            // 更新显示
            const totalSecs = Math.max(0, Math.floor(elapsed / 1000));
            const text = `${pad(Math.floor(totalSecs / 3600))}:${pad(Math.floor((totalSecs % 3600) / 60))}:${pad(totalSecs % 60)}`;
            if (timerEl.textContent !== text) timerEl.textContent = text;

            // 更新按钮文字 (︎ = 强制用文字符号，避免手机把它画成彩色 emoji)
            const label = state === 'paused' ? '▶︎ Start' : '⏸︎ Pause';
            if (btnToggle.textContent !== label) btnToggle.textContent = label;
            if (touchToggle.textContent !== label) touchToggle.textContent = label;
        }

        // Start / Pause
        function toggleBreak() {
            const { acc, state, lastStart } = getBreakState();
            if (state === 'running') {
                // 执行暂停：保存已累计的时间
                store.setItem(bAccKey, (acc + (Date.now() - lastStart)).toString());
                store.setItem(bStateKey, 'paused');
            } else {
                // 执行开始：更新最新起点
                store.setItem(bStartKey, Date.now().toString());
                store.setItem(bStateKey, 'running');
            }
            syncBreakUI();
        }

        // Reset：归零，并且强制回到暂停状态
        function resetBreak() {
            store.setItem(bAccKey, '0');
            store.setItem(bStateKey, 'paused');
            store.setItem(bStartKey, Date.now().toString());
            syncBreakUI();
        }

        // 电脑 / OBS Interact 的悬停按钮（行为和原来完全一样）
        btnToggle.addEventListener('click', toggleBreak);
        document.getElementById('break-btn-reset').addEventListener('click', resetBreak);

        // 时钟和计时器每 0.25 秒对一次表，画面上不会跳秒。
        // 粒子动画的每一帧也会顺便对表 (见第 5 节)：有些 App 内嵌的网页会把
        // setInterval 放慢，但只要画面还在渲染，时间就照样走。
        let lastTick = 0;
        function tick() { lastTick = performance.now(); updateClock(); syncBreakUI(); }
        setInterval(tick, 250);
        tick();

        // ============================================================
        // 3. 触屏控制条 (手机专用)
        // 轻点屏幕 → 底部出现 Start / Reset / Fullscreen，4 秒不碰自动隐藏
        // Reset 要连点两次才生效，防止直播中误触归零
        // ============================================================
        const touchBar = document.getElementById('touch-bar');
        const touchReset = document.getElementById('touch-btn-reset');
        const touchFull = document.getElementById('touch-btn-full');
        const BAR_HIDE_MS = 4000;
        let barHideTimer = null;
        let barShownAt = 0;
        let resetArmed = false;
        let resetArmTimer = null;

        function disarmReset() {
            resetArmed = false;
            clearTimeout(resetArmTimer);
            touchReset.classList.remove('armed');
            touchReset.textContent = '↻ Reset';
        }

        function hideBar() {
            touchBar.classList.remove('show');
            disarmReset();
        }

        function showBar() {
            if (!touchBar.classList.contains('show')) {
                touchBar.classList.add('show');
                barShownAt = performance.now();
            }
            clearTimeout(barHideTimer);
            barHideTimer = setTimeout(hideBar, BAR_HIDE_MS);
        }

        // 呼出控制条的那一下点击不算按钮操作，避免「一点屏幕就误触 Start」
        function barReady() { return performance.now() - barShownAt > 350; }

        function onTouch(e) {
            if (e.pointerType === 'mouse') return; // 鼠标继续用悬停按钮
            root.classList.add('touch-mode');
            showBar();
            keepAwake();
        }
        if (window.PointerEvent) {
            document.addEventListener('pointerdown', onTouch, { passive: true });
        } else {
            document.addEventListener('touchstart', onTouch, { passive: true });
        }

        touchToggle.addEventListener('click', () => {
            if (!barReady()) return;
            disarmReset();
            toggleBreak();
            showBar();
        });

        touchReset.addEventListener('click', () => {
            if (!barReady()) return;
            if (!resetArmed) {
                resetArmed = true;
                touchReset.classList.add('armed');
                touchReset.textContent = 'Tap again';
                resetArmTimer = setTimeout(disarmReset, 3000);
            } else {
                disarmReset();
                resetBreak();
            }
            showBar();
        });

        // --- 全屏：隐藏浏览器地址栏 (Android Chrome 支持；iPhone 请用「添加到主屏幕」) ---
        const requestFS = root.requestFullscreen || root.webkitRequestFullscreen;
        const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
        const fullscreenEl = () => document.fullscreenElement || document.webkitFullscreenElement;

        if (!requestFS || !exitFS) {
            touchFull.style.display = 'none';
        } else {
            touchFull.addEventListener('click', () => {
                if (!barReady()) return;
                try {
                    const p = fullscreenEl() ? exitFS.call(document) : requestFS.call(root, { navigationUI: 'hide' });
                    if (p && p.catch) p.catch(() => {});
                } catch (e) {}
                showBar();
            });
            const onFSChange = () => {
                touchFull.textContent = fullscreenEl() ? 'Exit full' : 'Fullscreen';
                fitStage();
            };
            document.addEventListener('fullscreenchange', onFSChange);
            document.addEventListener('webkitfullscreenchange', onFSChange);
        }

        // iPhone 双指缩放手势：禁用
        document.addEventListener('gesturestart', e => e.preventDefault());

        // ============================================================
        // 4. 屏幕常亮 (直播时手机不自动熄屏 / 锁屏)
        // 需要 https（GitHub Pages 没问题）。切回页面时自动重新申请。
        // ============================================================
        let wakeLock = null;
        async function keepAwake() {
            if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
            if (wakeLock && !wakeLock.released) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) { /* 省电模式等情况下会被拒绝，忽略即可 */ }
        }
        let hiddenSince = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') {
                hiddenSince = Date.now();
                return;
            }
            // 自动模式：画面被收起超过 10 秒后再出现，算作新的一次休息，从零开始
            if (AUTO_START && hiddenSince && Date.now() - hiddenSince > 10000) startFromZero();
            hiddenSince = 0;
            keepAwake();
            tick(); // 切回来立刻对表
        });
        keepAwake();

        // ============================================================
        // 5. CANVAS PARTICLES (粒子背景动画)
        // 粒子的大小、密度跟着舞台一起缩放，手机上的观感和电脑一致
        // ============================================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const particlesArray = [];
        let fieldW = 1920, fieldH = 1080; // 粒子活动范围（设计像素）

        class Particle {
            constructor() {
                this.x = Math.random() * fieldW;
                this.y = Math.random() * fieldH;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
                this.fadingOut = Math.random() > 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > fieldW) this.x = 0; else if (this.x < 0) this.x = fieldW;
                if (this.y > fieldH) this.y = 0; else if (this.y < 0) this.y = fieldH;
                if (this.fadingOut) {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingOut = false;
                } else {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingOut = true;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 216, 102, ${this.opacity})`;
                ctx.fill();
            }
        }

        function resizeParticles() {
            const vw = window.innerWidth, vh = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2); // 高清屏最多 2 倍，省电
            canvas.width = Math.max(1, Math.round(vw * dpr));
            canvas.height = Math.max(1, Math.round(vh * dpr));
            ctx.setTransform(dpr * stageScale, 0, 0, dpr * stageScale, 0, 0);

            const oldW = fieldW, oldH = fieldH;
            fieldW = vw / stageScale;
            fieldH = vh / stageScale;

            // 屏幕旋转后，把原有粒子按比例挪到新范围里
            particlesArray.forEach(p => { p.x *= fieldW / oldW; p.y *= fieldH / oldH; });

            // 1920×1080 的面积对应 60 颗，屏幕更宽/更高时按面积增减
            const target = Math.max(20, Math.min(140, Math.round(60 * (fieldW * fieldH) / (1920 * 1080))));
            while (particlesArray.length < target) particlesArray.push(new Particle());
            particlesArray.length = target;
        }

        function animateParticles() {
            if (performance.now() - lastTick > 200) tick();
            ctx.clearRect(0, 0, fieldW, fieldH);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        // ============================================================
        // 启动：先按当前屏幕摆好舞台，之后旋转 / 改变大小时自动重排
        // ============================================================
        fitStage();
        animateParticles();
        window.addEventListener('resize', fitStage);
        window.addEventListener('orientationchange', () => setTimeout(fitStage, 250));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);
    </script>
</body>
</html>
