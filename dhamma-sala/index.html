<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhamma Sala 礼佛堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Myanmar:wght@400;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: the whole screen is the temple, seen in first person. Words sit on top of it
     in two quiet bands: name and language above, the rite's four actions below.
     One visual world (candle-lit red lacquer and gold leaf), so one theme. */
  --lacquer-deep: #1c0507;
  --lacquer: #3d0d10;
  --gold: #e0ad45;
  --gold-pale: #f7e6b0;
  --ember: #ff9a3d;
  --ink: #2a0707;
  --text: #f1e2c6;
  --muted: #d6b998;
  --hair: color-mix(in srgb, var(--gold) 45%, transparent);
  --font-display: "Charm", "Noto Serif Myanmar", "Gentium Book Plus", "Songti SC", "Noto Serif CJK SC", serif;
  --font-body: "Gentium Book Plus", "Noto Serif Thai", "Noto Serif Myanmar", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--lacquer-deep); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
html[lang="th"] body { line-height: 1.75; }
html[lang="my"] body { line-height: 2; }

#app { position: relative; height: 100%; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#gl:active { cursor: grabbing; }

.top { position: absolute; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; padding: 12px 16px 36px; background: linear-gradient(rgba(16, 3, 5, .8), rgba(16, 3, 5, 0)); pointer-events: none; }
.top > * { pointer-events: auto; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 6vw, 34px); line-height: 1.3; color: var(--gold-pale); text-shadow: 0 2px 12px #000; }
html[lang="my"] h1 { font-weight: 600; line-height: 1.7; }
.here { margin: 0; font-size: 13.5px; color: var(--muted); text-shadow: 0 1px 8px #000; }
.langs { display: flex; border: 1px solid var(--hair); border-radius: 999px; padding: 3px; background: rgba(28, 5, 7, .6); }
.langs button { font: inherit; font-size: 14px; line-height: 1.5; min-height: 34px; padding: 3px 11px; border: 0; border-radius: 999px; background: none; color: var(--text); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

.gate, .hud { position: absolute; inset: auto 0 0 0; display: grid; justify-items: center; background: linear-gradient(rgba(16, 3, 5, 0), rgba(16, 3, 5, .86) 60%); }
.gate { gap: 12px; padding: 64px 16px 28px; text-align: center; }
.gate p { margin: 0; max-width: 38ch; text-wrap: balance; text-shadow: 0 1px 10px #000; }
.gate .tagline { color: var(--gold-pale); font-size: 17px; }
.gate .hint { color: var(--muted); font-size: 14px; }
.primary { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.4; padding: 10px 36px; border: 0; border-radius: 999px; background: var(--gold); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 1px var(--gold-pale) inset, 0 6px 34px rgba(255, 170, 70, .4); }
html[lang="my"] .primary { font-weight: 600; font-size: 19px; line-height: 1.9; }

.hud { gap: 8px; padding: 48px 12px 14px; pointer-events: none; transition: opacity .6s; }
.hud.off { opacity: 0; }
.hud.off .acts { pointer-events: none; }
.tip { position: absolute; inset: auto 16px 22px 16px; margin: 0; text-align: center; font-size: 14px; color: var(--muted); text-shadow: 0 1px 8px #000; opacity: 0; transition: opacity .6s; pointer-events: none; }
.tip.on { opacity: .95; }
.status { margin: 0; min-height: 1.7em; max-width: 44ch; text-align: center; color: var(--gold-pale); text-shadow: 0 1px 10px #000, 0 0 3px #000; text-wrap: balance; }
.acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 660px; pointer-events: auto; }
@media (min-width: 600px) { .acts { grid-template-columns: repeat(4, 1fr); } }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 6px 10px; font: inherit; color: var(--gold-pale); background: rgba(45, 9, 12, .8); border: 1px solid var(--hair); border-radius: 12px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.act:hover { background: rgba(80, 18, 22, .86); }
.act .n { font-size: 13px; line-height: 1.5; padding: 0 8px; border-radius: 999px; background: var(--gold); color: var(--ink); }
.act .n:empty { display: none; }

.bow-word { position: absolute; left: 16px; right: 16px; top: 40%; text-align: center; font-family: var(--font-display); font-size: 28px; color: var(--gold-pale); text-shadow: 0 2px 16px #000, 0 0 4px #000; opacity: 0; transition: opacity .5s; pointer-events: none; }
.bow-word.on { opacity: 1; }

.sheet { position: absolute; inset: auto 0 0 0; max-height: 62%; overflow: auto; padding: 12px 16px 22px; background: rgba(28, 5, 7, .95); border-top: 1px solid var(--gold); }
.sheet-in { max-width: 640px; margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.6; color: var(--gold); }
html[lang="my"] h2 { font-weight: 600; line-height: 1.9; }
.close { font: inherit; font-size: 14px; min-height: 36px; padding: 2px 14px; border: 1px solid var(--hair); border-radius: 999px; background: none; color: var(--text); cursor: pointer; }
.verse { display: grid; gap: 6px; padding: 12px 0 14px; border-bottom: 1px solid var(--hair); }
.verse:last-child { border-bottom: 0; }
.times { justify-self: end; font-size: 13px; color: var(--gold); border: 1px solid var(--hair); border-radius: 999px; padding: 0 10px; }
.pali { margin: 0; padding: 4px 10px; font-size: 20px; color: var(--gold-pale); border-inline-start: 2px solid transparent; transition: background .4s, border-color .4s; }
.pali.now { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 16%, transparent); color: #fff; }
.roman { display: block; font-size: 14px; font-style: italic; line-height: 1.5; color: var(--muted); }
.note, .tr { margin: 0; padding: 0 10px; font-size: 15px; }
.note { color: var(--muted); }

.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--gold-pale); background: var(--lacquer-deep); }
.fallback p { max-width: 36ch; margin: 0; }
button:focus-visible, #gl:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="3D temple"></canvas>

  <header class="top">
    <div><h1 id="t-name"></h1><p class="here" id="here" hidden></p></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-th" data-lang="th">ไทย</button>
      <button type="button" id="lang-my" data-lang="my">မြန်မာ</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
    </div>
  </header>

  <div class="gate" id="gate">
    <p class="tagline" id="t-tagline"></p>
    <button type="button" class="primary" id="enter"></button>
    <p class="hint" id="t-hint"></p>
  </div>

  <div class="hud" id="hud" hidden>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="acts">
      <button type="button" class="act" id="act-candle" data-act="candle"><span id="l-candle"></span><span class="n" id="n-candle"></span></button>
      <button type="button" class="act" id="act-bow" data-act="bow"><span id="l-bow"></span><span class="n" id="n-bow"></span></button>
      <button type="button" class="act" id="act-chant" data-act="chant"><span id="l-chant"></span></button>
      <button type="button" class="act" id="act-bell" data-act="bell"><span id="l-bell"></span></button>
    </div>
  </div>

  <p class="tip" id="tip" aria-hidden="true"></p>

  <div class="bow-word" id="bow-word" aria-hidden="true"></div>

  <section class="sheet" id="sheet" hidden aria-labelledby="t-chant">
    <div class="sheet-in">
      <div class="sheet-head"><h2 id="t-chant"></h2><button type="button" class="close" id="close"></button></div>
      <div id="verses"></div>
    </div>
  </section>

  <div class="fallback" id="fallback" hidden><p id="t-nogl"></p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        var n = state.bow >= 3 ? 0 : state.bow;         /* a fourth bow starts a new set of three */
        state.bow = n + 1; state.bowN++; say("bow", n); render();
        var w = $("bow-word"); w.textContent = L[state.lang].bows[n]; w.classList.add("on");
        world.bow(function () { w.classList.remove("on"); if (state.bow >= 3) { say("bowdone"); } });
      });
    } else if (k === "bell") {
      state.bell++; world.ring(); bellSound(); say("merit");
    } else if (k === "chant") { world.kneel(openChant); }
  }

  /* ================= other people in the hall ================= */
  var room = null, others = 0, othersCandles = 0, lastSent = "", bellSeen = {};
  function renderHere() {
    var h = $("here"), show = !!room && state.entered;
    h.hidden = !show;
    if (show) h.textContent = L[state.lang].here(others + 1);
  }
  function fin(v, a, b, d) { return typeof v === "number" && isFinite(v) ? Math.min(b, Math.max(a, v)) : d; }
  function onPeers(change) {
    var list = [], total = 0, count = 0;
    change.peers.forEach(function (p) {
      if (p.kind !== "viewer" || p.sameTab) return;
      var s = p.presence || {};
      if (s.in !== 1) return;
      count++; total += fin(s.n, 0, 27, 0);
      var bell = fin(s.bell, 0, 1e9, 0);
      if (p.peer in bellSeen && bell > bellSeen[p.peer] && world) { world.ring(); bellSound(); }
      bellSeen[p.peer] = bell;
      if (list.length < 40) list.push({ id: String(p.peer), x: fin(s.x, -9, 9, 0), z: fin(s.z, -12, 25, -3), yaw: fin(s.yaw, -1e4, 1e4, 0), sit: s.sit === 1, lit: s.lit === 1, bow: fin(s.bow, 0, 1e9, 0) });
    });
    others = count; othersCandles = total;
    if (world) { world.setPeers(list); world.setTray(state.candles + total, true); }
    renderHere();
  }
  function publish() {
    if (!room || !world || !state.entered) return;
    var q = world.pose();
    var patch = { in: 1, x: q.x, z: q.z, yaw: q.yaw, sit: q.sit ? 1 : 0, lit: state.lit ? 1 : 0, n: state.candles, bow: state.bowN, bell: state.bell };
    var s = JSON.stringify(patch);
    if (s === lastSent) return;
    lastSent = s;
    room.presence(patch).catch(function () {});
  }
  function joinRoom() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use("room").then(function (r) {
      if (!r) return;
      room = r;
      r.onPeers(onPeers, function () { room = null; others = 0; othersCandles = 0; if (world) world.setPeers([]); renderHere(); });
      setInterval(publish, 120);
      renderHere();
    }).catch(function () {});
  }

  function openChant() {
    if (chantTimer) return;
    $("sheet").hidden = false; render();
    var i = 0;
    state.status = { k: "chanting" };
    chantStart();
    function step() {
      Array.prototype.forEach.call(document.querySelectorAll(".pali.now"), function (p) { p.classList.remove("now"); });
      var badge = document.querySelector(".times");
      if (i >= CHANT_SEQ.length) { chantTimer = 0; chantStop(); if (badge) badge.textContent = L[state.lang].times; state.status = { k: "chant" }; render(); return; }
      var ref = CHANT_SEQ[i].split("-"), verse = VERSES.filter(function (v) { return v.id === ref[0]; })[0];
      var syl = syllables(verse.lines[+ref[1]].ro), dur = syl.reduce(function (a, s) { return a + s.d; }, 0);
      chantLine(syl);
      var p = $("ln-" + CHANT_SEQ[i]);
      if (p) { p.classList.add("now"); if (p.scrollIntoView) p.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" }); }
      if (badge) badge.textContent = i < 3 ? num(i + 1, state.lang) + " / " + num(3, state.lang) : L[state.lang].times;
      i++;
      chantTimer = setTimeout(step, (dur + .7) * 1000);                 /* the line lasts as long as its chant */
    }
    step();
    $("close").focus({ preventScroll: true });
  }
  function closeChant() {
    if (chantTimer) { clearTimeout(chantTimer); chantTimer = 0; if (state.status.k === "chanting") state.status = { k: "hint" }; }
    chantStop();
    $("sheet").hidden = true; render();
    armHide(5000);
    $("act-chant").focus({ preventScroll: true });
  }

  /* ================= wiring ================= */
  document.querySelector(".acts").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".act") : null;
    if (b) act(b.dataset.act);
  });
  document.querySelector(".langs").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || !L[b.dataset.lang]) return;
    if (chantTimer) { clearTimeout(chantTimer); chantTimer = 0; chantStop(); $("sheet").hidden = true; state.status = { k: "hint" }; }
    state.lang = b.dataset.lang;
    try { localStorage.setItem("dhamma-sala-lang", state.lang); } catch (err) {}
    render();
  });
  $("enter").addEventListener("click", function () {
    if (!world) return;
    state.entered = true; $("gate").hidden = true;
    world.holdCandle(true, state.lit); renderHere();
    world.enter(function () { say("hint"); render(); $("gl").focus({ preventScroll: true }); });
  });
  $("close").addEventListener("click", closeChant);
  document.querySelector(".acts").addEventListener("focusin", function () { if (hudOff) { setHud(false); armHide(6000); } });

  function start(saved) {
    state = fresh(pickLang());
    if (saved && typeof saved === "object") {
      ["lang", "entered", "candles", "lit", "bow"].forEach(function (k) { if (k in saved) state[k] = saved[k]; });
      if (!L[state.lang]) state.lang = "th";
    }
    try {
      if (!window.THREE) throw new Error("three.js did not load");
      world = buildWorld($("gl"));
      world.onAct = act;
      world.onSit = function () { say("settle"); };
      world.onSeat = onSeat;
      world.onTap = function () { if (!hudOff) return false; setHud(false); armHide(6000); return true; };
      world.canWalk = function () { return state.entered && $("sheet").hidden; };
      world.chanting = function () { return !!chantTimer; };
      if (state.entered) { world.placeInside(); world.setTray(state.candles, false); world.holdCandle(true, state.lit); } else world.placeOutside();
      world.start();
    } catch (err) {
      world = null; $("fallback").hidden = false; $("gate").hidden = true;
    }
    render();
    if (!world) { $("gate").hidden = true; $("hud").hidden = true; }
    else joinRoom();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { lang: state.lang, entered: state.entered, candles: state.candles, lit: state.lit, bow: state.bow }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
